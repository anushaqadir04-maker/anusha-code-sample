<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anusha Abdul Qadir | Full-Stack Software Engineering Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;

            background: #1e293b;
            padding: 50px 35px;
            border-radius: 16px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .role {
            font-size: 1.15rem;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .skill {
            background: #334155;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            border: 1px solid #475569;
        }

        .portfolio-btn {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;

            transition: background 0.3s ease,
                        transform 0.3s ease;
        }

        .portfolio-btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Anusha Abdul Qadir</h1>

        <p class="role">
            Full-Stack Software Engineering Student
        </p>

        <section class="skills" aria-label="Technical Skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">JavaScript</span>
            <span class="skill">PHP</span>
            <span class="skill">React</span>
        </section>

        <a
            href="https://anushadev.infinityfreeapp.com"
            target="_blank"
            rel="noopener noreferrer"
            class="portfolio-btn"
        >
            View My Portfolio
        </a>

        <p class="footer">
            Full-Stack Software Engineering Student & Web Developer
        </p>

    </main>

</body>
</html>
